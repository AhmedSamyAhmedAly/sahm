name: Intraday news refresh

# EGX prices are end-of-day only, so the price signals can't change during the
# day — but NEWS can. This refreshes only the news overlay (sentiment, catalysts,
# light re-rank) on the latest scan. Cheap: shortlist only, tiny DB writes. Sun-Thu.
#
# The FIRST enrichment now runs inside daily-scan.yml, right after the picks are
# published (~04:20 Cairo), so the open is covered there. This job exists for news
# that breaks DURING the session — one pass shortly after the 10:00 Cairo open.
# The old midday/after-close slots were dropped: 14:23 Cairo landed minutes before
# the 14:30 close and 17:23 was after it, so neither could change a trading decision.
on:
  schedule:
    - cron: "23 8 * * 0-4"    # ~11:23 Cairo — ~1.5h into the session
  workflow_dispatch: {}

jobs:
  news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-engine.txt
      - name: Refresh news overlay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_TOKEN }}
          ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
        run: python -m app.cli news
