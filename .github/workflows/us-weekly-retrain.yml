name: US weekly retrain (manual — needs local history)

# NOT on a schedule, on purpose.
#
# Retraining the US models needs the FULL 16-year history (~4.7 GB, ~19M training
# rows). That does not fit a free CI runner — it exhausts memory before finishing.
# So the US retrain is run on a real machine (16 GB is enough) and its small output
# (3 models + hit-rate bands) is pushed to the serving DB:
#
#   cd backend
#   MARKET=US DATABASE_URL="sqlite:///./sahm-us.db" python -m app.cli ingest --batch 2000
#   #   ^ resumable: repeat until it prints remaining=0
#   MARKET=US DATABASE_URL="sqlite:///./sahm-us.db" python -m app.cli retrain
#   MARKET=US DATABASE_URL="<serving db>" LOCAL_DB_URL="sqlite:///./sahm-us.db" \
#       python scripts/push_results_to_neon.py
#
# Models decay slowly — every 1-3 months is plenty. The DAILY scan runs in CI
# against the serving DB and is unaffected (see us-daily-scan.yml).
#
# This workflow stays here as a documented manual escape hatch: it will attempt the
# retrain on a runner if you ever want to try (e.g. with a larger runner), but it is
# expected to fail on the free tier.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" — expected to run out of memory on a free runner'
        required: true
        default: "no"

jobs:
  retrain:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MARKET: US
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-engine.txt

      - name: Restore US history cache (if one was ever uploaded)
        uses: actions/cache/restore@v4
        with:
          path: backend/sahm-us.db
          key: sahm-us-db-${{ github.run_id }}
          restore-keys: sahm-us-db-

      - name: Retrain (expects a populated local history)
        env:
          DATABASE_URL: "sqlite:///./sahm-us.db"
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          if [ ! -f sahm-us.db ]; then
            echo "::error::No US history cache. Retrain locally instead — see the header of this file."
            exit 1
          fi
          python -m app.cli retrain

      - name: Push US models + bands to the serving DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOCAL_DB_URL: "sqlite:///./sahm-us.db"
        run: python scripts/push_results_to_neon.py

      - name: Save US history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/sahm-us.db
          key: sahm-us-db-${{ github.run_id }}
