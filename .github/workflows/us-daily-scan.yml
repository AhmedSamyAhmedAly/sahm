name: Daily US scan

# Daily US signals, run DIRECTLY against the serving database.
#
# Why no local cache: the US universe's full 16-year history is ~4.7 GB, which does
# not fit a free CI runner. But the daily job doesn't need it — the scan reads only
# the last ~400 bars per ticker (indicators need 210) and the serving DB keeps ~1
# year. Full history is only required by the weekly RETRAIN, which is run manually
# on a real machine (see docs/US_MARKET.md).
#
# The US cash session opens 09:30 America/New_York. These UTC times stay pre-open in
# both EST (UTC-5) and EDT (UTC-4), and the prior session's EOD data is published
# overnight, so the scan always has fresh closes to work with. Mon-Fri.
on:
  schedule:
    - cron: "40 8 * * 1-5"    # 03:40 EST / 04:40 EDT — well before the open
    - cron: "40 12 * * 1-5"   # backup, still pre-open (07:40 EST / 08:40 EDT)
  workflow_dispatch: {}

concurrency:
  group: us-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MARKET: US
      TZ: UTC
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-engine.txt

      # Top up yesterday's bars, grade matured calls, then publish today's picks.
      # Writes land straight in the serving DB — no separate push step.
      - name: Ingest top-up + grade + scan (US)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_TOKEN }}
          ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN }}
        run: python -m app.cli daily

      # Keep the serving DB lean: drop chart history older than the window the UI
      # can display, so daily appends don't grow it without bound.
      - name: Trim old chart history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MARKET: US
          ACTIVE_DAYS: "380"
          INACTIVE_DAYS: "380"
        run: python scripts/trim_bars.py
